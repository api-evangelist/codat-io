aid: codat-io
url: https://raw.githubusercontent.com/api-evangelist/codat-io/refs/heads/main/apis.yml
name: Codat
kind: company
description: Codat provides a business data API that connects small-business accounting,
  banking, and commerce platforms to lenders, fintechs, and B2B software providers.
  A single integration to api.codat.io standardizes data from QuickBooks, Xero, Sage,
  NetSuite, FreshBooks, and 30+ other systems - and can write bills, payments, and
  expenses back into them - powering underwriting, reconciliation, payables, and
  spend products.
deliveryModel:
  model: saas
  open_source: false
  commercial: true
  callable_host: true
  label: Hosted service · you call their endpoint
  confidence: high
  source:
  - openapi
  - pricing
  generated: '2026-08-28'
  method: derived
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: true
  try_now: true
  public: false
  label: Freemium (free trial) · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/codat-io.png
