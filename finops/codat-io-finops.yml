created: '2026-07-01'
modified: '2026-07-01'
reconciled: false
tags:
- Business Data
- Accounting
- Banking
- Commerce
- Fintech
- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of Codat spend. Codat is sold on sales-negotiated commercial
  agreements rather than a public usage rate card, so the primary cost driver is
  the number of linked companies (connected customers) and the mix of enabled
  products (Lending, Sync for Payables/Expenses/Commerce, Bank Feeds, Spend
  Insights). Cost management therefore centers on connection lifecycle hygiene -
  unlinking dormant companies and disabling unused data types - rather than
  per-call token metering.
notes: >-
  Exact billing dimensions are set per contract; align these meters with the
  invoice schedule agreed with Codat during reconciliation.
sources:
- https://www.codat.io/pricing/
- https://docs.codat.io
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Codat
serviceCategory: Financial Data and Analytics
billingModel:
  pricingCategory: Committed / Sales-Quoted
  billingFrequency: Monthly or Annual (per agreement)
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Codat
  ServiceCategory: Financial Data and Analytics
  ProviderName: Codat
  PublisherName: Codat
  InvoiceIssuerName: Codat
  BillingCurrency: USD
  ChargeCategory: Usage
  PricingCategory: Committed
meters:
- name: linked_companies
  description: Count of active linked companies (connected customers) billed per agreement.
  unit: companies
  aggregation: max
  dimensions:
  - account
  - product
- name: connections
  description: Active data connections across accounting, banking, commerce, and bank-feed sources.
  unit: connections
  aggregation: max
  dimensions:
  - account
  - company
  - sourceType
- name: product_entitlements
  description: Enabled Codat products (Lending, Sync for Payables/Expenses/Commerce, Bank Feeds).
  unit: products
  aggregation: max
  dimensions:
  - account
  - product
- name: data_pulls
  description: Volume of asynchronous data-refresh (pull) operations run per company.
  unit: operations
  aggregation: sum
  dimensions:
  - account
  - company
  - dataType
principles:
- name: Visibility
  description: >-
    Track active linked companies and connections in the Codat portal; reconcile
    against the contracted commitment to spot drift early.
- name: Allocation
  description: >-
    Tag companies and connections to internal customers/products so Codat spend
    maps back to the revenue it enables.
- name: Optimization
  description: >-
    Unlink dormant companies, disable unused data types, and rely on webhooks
    instead of polling to keep pull volume - and support overhead - down.
- name: Accountability
  description: >-
    Assign an owner for the Codat relationship; review linked-company counts and
    product usage monthly against the commercial agreement.
